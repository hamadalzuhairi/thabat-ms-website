<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Connection Test</title>
<style>
  :root { --bg:#F4F7FC; --surface:#fff; --ink:#0B1F3A; --ink2:#42546E; --line:#D2DCEA; --brand:#034EA2; --alert:#A84800; --good:#16714A; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#071427; --surface:#0E213D; --ink:#EAF2FF; --ink2:#BACAE3; --line:#25426C; --brand:#8DBBFA; --alert:#FFB06B; --good:#63D6A0; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  section { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:12px 0; }
  h1 { font-size:20px; } h2 { font-size:16px; margin:0 0 8px; }
  input, select, button { font:inherit; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); min-height:40px; }
  button { background:var(--brand); color:#fff; border:0; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-size:14px; } td, th { border-bottom:1px solid var(--line); padding:6px; text-align:start; }
  .muted { color:var(--ink2); font-size:13px; } .alert { color:var(--alert); font-weight:600; } .ok { color:var(--good); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  code { font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<main>
  <h1>Thabat clinic: connection test</h1>
  <p class="muted">Plain page that proves the phone → Firebase → clinic path works. The real dashboard is <code>index.html</code>. Test data only.</p>

  <section id="login">
    <h2>Sign in</h2>
    <div class="row">
      <input id="email" type="email" placeholder="email" autocomplete="username">
      <input id="pw" type="password" placeholder="password" autocomplete="current-password">
      <button id="go">Sign in</button>
      <span id="who" class="muted"></span>
      <button id="out" hidden>Sign out</button>
    </div>
  </section>

  <section id="patients" hidden>
    <h2>Patients <span id="scope" class="muted"></span></h2>
    <table><thead><tr><th>Code</th><th>Name</th><th>Status</th><th>Doctor</th><th>Last seen</th><th></th></tr></thead><tbody id="plist"></tbody></table>
  </section>

  <section id="detail" hidden>
    <h2 id="dtitle"></h2>
    <div id="dstate"></div>
    <div id="dalerts"></div>
    <table><thead><tr><th>Day</th><th>State</th><th>ms</th><th>Usual</th><th>Taps</th><th>Running min</th><th>Doses</th></tr></thead><tbody id="ddays"></tbody></table>
  </section>
</main>
<script src="firebase-config.js"></script>
<script type="module">
  import * as T from "./thabat-data.js";
  const $ = (s) => document.querySelector(s);
  // Everything that came from the database is escaped before it goes into the page.
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let doctors = [], stopList = null, stopDetail = null;

  if (!(await T.init(window.THABAT_FIREBASE))) { $("#who").textContent = "No firebase-config.js"; }
  $("#go").onclick = () => T.signIn($("#email").value, $("#pw").value).catch((e) => ($("#who").textContent = e.code));
  $("#out").onclick = () => T.signOut();

  T.onAuth(async (u) => {
    stopList && stopList(); stopDetail && stopDetail(); $("#detail").hidden = true;
    $("#out").hidden = !u; $("#patients").hidden = !u || !u.role;
    $("#who").textContent = u ? `${u.name} · ${u.role || "no role"}` : "";
    if (!u || !u.role) return;
    doctors = u.role === "admin" ? await T.listDoctors() : [];
    $("#scope").textContent = u.role === "admin" ? "(all, admin)" : "(assigned to you)";
    stopList = T.watchPatients(render);
  });

  function render(list) {
    const me = T.currentUser();
    $("#plist").innerHTML = "";
    for (const p of list) {
      const tr = document.createElement("tr");
      const doc = doctors.find((d) => d.uid === p.doctorId);
      tr.innerHTML = `<td><code>${esc(p.code)}</code>${p.simulated ? ' <span class="muted">simulated</span>' : ""}</td>
        <td>${esc(p.displayName || "—")}</td><td>${esc(p.status)}</td><td>${esc(doc ? doc.name : (p.doctorId ? "assigned" : "—"))}</td>
        <td class="muted">${p.lastSeenAt ? new Date(p.lastSeenAt).toLocaleString() : ""}</td><td></td>`;
      const cell = tr.lastElementChild;
      if (me.role === "admin") {
        const sel = document.createElement("select");
        sel.innerHTML = `<option value="">Assign doctor…</option>` + doctors.map((d) => `<option value="${esc(d.uid)}" ${d.uid === p.doctorId ? "selected" : ""}>${esc(d.name)}</option>`).join("");
        const name = document.createElement("input"); name.placeholder = "Test name"; name.value = p.displayName || ""; name.size = 10;
        const b = document.createElement("button"); b.textContent = "Save";
        b.onclick = () => sel.value && T.assignDoctor(p.uid, sel.value, name.value || null);
        cell.append(name, sel, b);
      }
      const open = document.createElement("button"); open.textContent = "Open"; open.onclick = () => show(p.uid);
      cell.append(open);
      $("#plist").append(tr);
    }
  }

  function show(uid) {
    stopDetail && stopDetail();
    $("#detail").hidden = false;
    stopDetail = T.watchPatient(uid, (data) => {
      const v = T.toDashboardShape(data);
      $("#dtitle").textContent = `${v.p ? v.p.name : uid} · ${v.p ? v.p.code : ""}${v.p && v.p.simulated ? " · Simulated data" : ""}`;
      $("#dstate").innerHTML = `Status: <b class="${v.st.st === "alert" ? "alert" : ""}">${esc(v.st.st)}</b>${v.st.days ? ` (${v.st.days} slower days)` : ""}${v.st.paused ? " · monitoring paused" : ""}`;
      $("#dalerts").innerHTML = "";
      for (const a of v.alerts) {
        const div = document.createElement("div");
        div.className = "row";
        div.innerHTML = `<span class="${a.state === "open" ? "alert" : "ok"}">Alert from ${esc(a.startedOn)}, ${esc(a.days)} days: ${esc(a.state)}${a.note ? " — " + esc(a.note) : ""}</span>`;
        if (a.state === "open") {
          const note = document.createElement("input"); note.placeholder = "Note";
          const b = document.createElement("button"); b.textContent = "Acknowledge";
          b.onclick = () => T.acknowledgeAlert(uid, a.id, note.value);
          div.append(note, b);
        }
        $("#dalerts").append(div);
      }
      $("#ddays").innerHTML = v.s.slice().reverse().map((d) =>
        `<tr><td>${esc(d.day)}</td><td>${esc(d.state)}</td><td>${esc(d.ms ?? "No data")}</td><td>${esc(d.usual ?? "")}</td><td>${esc(d.taps)}</td><td>${esc(d.monitoredMinutes)}</td><td>${esc(d.doses.map((x) => x.kind + " " + x.status).join(", "))}</td></tr>`).join("");
    });
  }
</script>
</body>
</html>
