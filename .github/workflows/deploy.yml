# Deploys the site to Vercel (account hamad_alzuhairi20@hotmail.com, team LOCALI) on every push to main.
# Needs the repository secret VERCEL_TOKEN: a Vercel access token whose scope is the project
# thabat-ms-website (or the whole LOCALI team). A token scoped to another project fails with "Project not found".
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_tNRAWxCclilQh0LBLAj6kgOS
      VERCEL_PROJECT_ID: prj_i1CYwFcdP32j3TOugtA4zh1QMqLS
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the token is set
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add the repository secret VERCEL_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Deploy to production
        run: npx --yes vercel@63.1.2 deploy --prod --yes --token="$VERCEL_TOKEN"
